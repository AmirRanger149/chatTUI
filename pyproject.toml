[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-tui"
version = "0.1.0"
description = "A modular terminal chat client for Google Gemini"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "textual>=0.70.0",
]

[project.scripts]
chat-tui = "app:main"

[tool.setuptools]
py-modules = ["app", "config"]
packages = ["api", "state", "ui"]
